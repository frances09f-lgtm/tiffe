name: Deploy Tiffe Review alongside Demo
on:
  workflow_dispatch:
  push:
    branches: [backend-review]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: tiffe-admin-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 22fd0d42a992eb5716df8ef638e2b56b03cf5d8f
          path: web-source
      - name: Restore web scaffolding
        run: cp -a web web-source/web
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
      - name: Build approved owner admin site
        working-directory: web-source
        run: |
          flutter pub get
          flutter build web --release -t lib/web_admin_main.dart --base-href /tiffe/review/admin/ \
            --dart-define=TIFFE_SUPABASE_URL=https://obbtxyjglgivcpusjpcx.supabase.co \
            --dart-define=TIFFE_SUPABASE_KEY=sb_publishable__5qR0bvVmwqKykgbQpAtRw_H0eIgl3_ \
            --dart-define=TIFFE_OWNER_EMAIL=frances09f@gmail.com
      - name: Replace admin site only
        run: |
          rm -rf admin-site/review/admin
          mkdir -p admin-site/review/admin
          cp -a web-source/build/web/. admin-site/review/admin/
          printf '%s\n' '{"app_version":"1.0.43+43","source_commit":"22fd0d42a992eb5716df8ef638e2b56b03cf5d8f","entrypoint":"lib/web_admin_main.dart","backend":"connected"}' > admin-site/review/admin/version.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: admin-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
