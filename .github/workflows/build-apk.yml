name: Build APK
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Attach artifacts to an existing reviewed, source-bound release
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore:
      - 'distribution/audits/**'
permissions:
  contents: write
concurrency:
  group: tiffe-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
      - name: Apply reviewed customer-only v49 source patch
        if: github.ref == 'refs/heads/feat/customer-in-app-update'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD~1)" = ad222d48430be20fbcb36e6bd584680fafe8b99a
          curl --fail --location --retry 3 'https://my.pally.com/f/QtwY2iI5lKz1?download=1' -o "$RUNNER_TEMP/customer-patch.zip"
          echo 'f44a425fd9f1c3917180feb7b8e185d0bc9be661b6d5359ad2fa38227e646d38  '"$RUNNER_TEMP/customer-patch.zip" | sha256sum --check
          python3 - <<'PY'
          import os, pathlib, zipfile
          allowed = {'lib/update/app_update.dart', 'lib/live/update_check.dart', 'lib/connected_main.dart', 'lib/live/live_app.dart', 'lib/ui/gemini/orders_screen.dart', 'lib/ui/app.dart', 'lib/ui/scheduled_tracking.dart', 'lib/ui/subscriber_orders.dart', 'lib/domain/delivery_schedule.dart', 'android/app/src/main/kotlin/com/tiffe/tiffe/MainActivity.kt', 'android/app/src/main/kotlin/com/tiffe/tiffe/DeliveryNotificationReceiver.kt', 'pubspec.yaml', 'lib/live/bug_report.dart', '.github/workflows/build-apk.yml', 'test/update_check_test.dart', 'test/update/app_update_test.dart', 'test/daily_orders_test.dart', 'test/live_shell_test.dart', 'test/ui_test.dart', 'test/customer_staff_status_invariants_test.dart'}
          with zipfile.ZipFile(os.environ['RUNNER_TEMP'] + '/customer-patch.zip') as z:
              assert set(z.namelist()) == allowed, 'Unexpected patch paths'
              for name in z.namelist():
                  assert not pathlib.PurePosixPath(name).is_absolute() and '..' not in pathlib.PurePosixPath(name).parts
                  path = pathlib.Path(name)
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(z.read(name))
          PY
          dart format lib/update/app_update.dart lib/live/update_check.dart lib/connected_main.dart lib/live/live_app.dart lib/ui/gemini/orders_screen.dart lib/ui/app.dart lib/ui/scheduled_tracking.dart lib/ui/subscriber_orders.dart lib/domain/delivery_schedule.dart lib/live/bug_report.dart test/update_check_test.dart test/update/app_update_test.dart test/daily_orders_test.dart test/live_shell_test.dart test/ui_test.dart test/customer_staff_status_invariants_test.dart
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib android/app/src/main pubspec.yaml .github/workflows/build-apk.yml test
          git commit -m 'Customer v49: direct feed updates, price-only cards, staff-only statuses'
          git push origin HEAD:feat/customer-in-app-update
          echo "Customer source commit: $(git rev-parse HEAD). Rerun this workflow on the resulting commit before releasing." >> "$GITHUB_STEP_SUMMARY"
      - name: Validate matching app version
        id: version
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          version = re.search(r'^version:\s*(1\.0\.(\d+)\+\d+)\s*$', pathlib.Path('pubspec.yaml').read_text(), re.M)
          assert version, 'Invalid pubspec version'
          full, code = version.group(1), version.group(2)
          assert full == f'1.0.{code}+{code}', 'Version name/build number mismatch'
          assert f"'{full}'" in pathlib.Path('lib/live/bug_report.dart').read_text(), 'Bug report version mismatch'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'tag=v{code}\nname=1.0.{code}\ncode={code}\n')
          PY
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --dart-define=TIFFE_OWNER_EMAIL=frances09f@gmail.com
      - name: Build connected APK and AAB with permanent signing identity
        env:
          TIFFE_KEYSTORE_BASE64: ${{ secrets.TIFFE_KEYSTORE_BASE64 }}
          TIFFE_KEYSTORE_FILE: ${{ runner.temp }}/tiffe-release.jks
          TIFFE_KEYSTORE_PASSWORD: ${{ secrets.TIFFE_KEYSTORE_PASSWORD }}
          TIFFE_KEY_PASSWORD: ${{ secrets.TIFFE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          : "${TIFFE_KEYSTORE_BASE64:?Missing signing keystore}"
          : "${TIFFE_KEYSTORE_PASSWORD:?Missing keystore password}"
          : "${TIFFE_KEY_PASSWORD:?Missing key password}"
          trap 'rm -f "$TIFFE_KEYSTORE_FILE"' EXIT
          printf '%s' "$TIFFE_KEYSTORE_BASE64" | base64 -d > "$TIFFE_KEYSTORE_FILE"
          flutter clean
          flutter pub get
          args=(--release -t lib/connected_main.dart
            --build-name='${{ steps.version.outputs.name }}'
            --build-number='${{ steps.version.outputs.code }}'
            --dart-define=TIFFE_SUPABASE_URL=https://obbtxyjglgivcpusjpcx.supabase.co
            --dart-define=TIFFE_SUPABASE_KEY=sb_publishable__5qR0bvVmwqKykgbQpAtRw_H0eIgl3_
            --dart-define=TIFFE_OWNER_EMAIL=frances09f@gmail.com)
          flutter build appbundle "${args[@]}"
          mv build/app/outputs/bundle/release/app-release.aab build/app/outputs/bundle/release/Tiffe.aab
          flutter build apk "${args[@]}" --target-platform android-arm,android-arm64
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Tiffe.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tiffe-connected-apk
          if-no-files-found: error
          path: |
            build/app/outputs/flutter-apk/Tiffe.apk
            build/app/outputs/bundle/release/Tiffe.aab
      - name: Attach artifacts to reviewed release without editing metadata
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$RUNNER_TEMP/release.json"
          gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" > "$RUNNER_TEMP/tag.json"
          python3 - <<'PY'
          import json, os
          root = os.environ['RUNNER_TEMP']
          release = json.load(open(root + '/release.json'))
          tag = json.load(open(root + '/tag.json'))
          assert not release.get('immutable'), 'Immutable release: stop'
          assert tag['sha'] == os.environ['GITHUB_SHA'], 'Release tag is not this build source'
          assert not any(a['name'] in ('Tiffe.apk', 'Tiffe.aab') for a in release['assets']), 'Assets already exist: reconcile, do not overwrite'
          PY
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" build/app/outputs/flutter-apk/Tiffe.apk build/app/outputs/bundle/release/Tiffe.aab
