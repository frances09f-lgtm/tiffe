name: Distribute Parent speed alert fix v1.4.3 privately
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - name: parent
            app: 'projects/509368336413/apps/1:509368336413:android:90f647c88882d7e40a46f4'
            repo: child-safety-parent
            tag: v1.4.3
            asset: ChildSafetyParent-v1.4.3.apk
            sha: a26ea4cca138ee5c211255e246757bfda5072e0344e611e721c74e1d33bbbda2
            build: '8'
            version: '1.4.3'
            notes: 'Parent1.4.3 fixes speed alert delivery without pending FCM. Child Sync Interval > Enable speed alert, set threshold, Save Alert Settings, allow Android notifications. Foreground30s/background15min or later, not instant. Requires two fresh accurate GPS speeds. Shows recorded speed alert history; tap notification opens child settings. Same signer, install over existing, Child1.0.11 unchanged. Signed release audited, isolated Android15 notification/tap pixels and narrow server tests passed. Owner real-device test.'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm ci --prefix distribution/tooling --ignore-scripts --no-audit --no-fund
      - name: Download reviewed published APK and verify hash
        env:
          SOURCE_REPO: ${{ matrix.repo }}
          SOURCE_TAG: ${{ matrix.tag }}
          SOURCE_ASSET: ${{ matrix.asset }}
          EXPECTED_SHA: ${{ matrix.sha }}
        run: |
          curl -fL "https://github.com/frances09f-lgtm/$SOURCE_REPO/releases/download/$SOURCE_TAG/$SOURCE_ASSET" -o "$RUNNER_TEMP/App.apk"
          printf '%s %s\n' "$EXPECTED_SHA" "$RUNNER_TEMP/App.apk" | sha256sum -c
      - name: Upload and distribute to existing owner tester
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_APP_RESOURCE: ${{ matrix.app }}
          EXPECTED_SHA: ${{ matrix.sha }}
          EXPECTED_BUILD: ${{ matrix.build }}
          EXPECTED_VERSION: ${{ matrix.version }}
          RELEASE_NOTES: ${{ matrix.notes }}
          RESULT_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          umask 077
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-distribution.json"
          trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          unset FIREBASE_SERVICE_ACCOUNT_JSON
          node scripts/firebase_parent_child_v1.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: firebase-${{ matrix.name }}-result
          path: ${{ runner.temp }}/firebase-${{ matrix.name }}-result.json
