name: Distribute audited phone activity Parent v1.2.0 and Child v9 privately
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - name: parent
            app: 'projects/509368336413/apps/1:509368336413:android:90f647c88882d7e40a46f4'
            repo: child-safety-parent
            tag: v1.2.0
            asset: ChildSafetyParent-v1.2.0.apk
            sha: 87ad1ef7123c7d96f76cb8796ad10845c0be4d3e792ed6ff712fea40ed05adf1
            build: '3'
            version: '1.2.0'
            notes: 'Child Safety Parent v1.2.0: Phone Activity tab requires Child v1.0.9 and visible child-phone consent. Counts and durations only. Install over previous parent version. Push alerts remain inactive until FCM server JSON is configured. Not tested on a physical phone; runtime coverage is in worker report.'
          - name: child
            app: 'projects/509368336413/apps/1:509368336413:android:664d240443b77a5a0a46f4'
            repo: child-safety-client
            tag: v9
            asset: ChildSafetyTracker-v1.0.9.apk
            sha: ba9da1d11b463159f39286bc2f110bcf8027ea1ef2fdcbfa31a04b861f3465af
            build: '9'
            version: '1.0.9'
            notes: 'Child Safety v1.0.9: visible, consent-based phone activity counts and durations. Usage Access needed for per-app time; optional Notification Access counts only, no content. No messages, call content, hidden screenshots, microphone or camera. Android/vendor restrictions and coarse motion limitations apply. Install over existing version. Not tested on a physical phone; consult worker report for verified metrics and unavailable features.'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm ci --prefix distribution/tooling --ignore-scripts --no-audit --no-fund
      - name: Download reviewed published APK and verify hash
        env:
          SOURCE_REPO: ${{ matrix.repo }}
          SOURCE_TAG: ${{ matrix.tag }}
          SOURCE_ASSET: ${{ matrix.asset }}
          EXPECTED_SHA: ${{ matrix.sha }}
        run: |
          curl -fL "https://github.com/frances09f-lgtm/$SOURCE_REPO/releases/download/$SOURCE_TAG/$SOURCE_ASSET" -o "$RUNNER_TEMP/App.apk"
          printf '%s %s\n' "$EXPECTED_SHA" "$RUNNER_TEMP/App.apk" | sha256sum -c
      - name: Upload and distribute to existing owner tester
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_APP_RESOURCE: ${{ matrix.app }}
          EXPECTED_SHA: ${{ matrix.sha }}
          EXPECTED_BUILD: ${{ matrix.build }}
          EXPECTED_VERSION: ${{ matrix.version }}
          RELEASE_NOTES: ${{ matrix.notes }}
          RESULT_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          umask 077
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-distribution.json"
          trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          unset FIREBASE_SERVICE_ACCOUNT_JSON
          node scripts/firebase_parent_child_v1.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: firebase-${{ matrix.name }}-result
          path: ${{ runner.temp }}/firebase-${{ matrix.name }}-result.json
