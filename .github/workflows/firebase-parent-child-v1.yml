name: Distribute audited Parent v1 and Child v8 privately
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - name: parent
            app: 'projects/509368336413/apps/1:509368336413:android:90f647c88882d7e40a46f4'
            repo: child-safety-parent
            tag: v1
            sha: c1a109755ac792b7156c6ec326fef2a519cdd898e05e4ac4c6b39288ef788f93
            build: '1'
            version: '1.0.1'
            notes: 'Child Safety Parent v1: approved family UI, all child maps, recorded route playback, safe zones, report intervals, password popup and reset email, optional low-battery and speed alerts. Push is inactive until FCM server credential is configured and notification permission is granted. Install Child v8 for encrypted offline replay and reliable speed metadata. Report/network/Android delays apply; not emergency protection.'
          - name: child
            app: 'projects/509368336413/apps/1:509368336413:android:664d240443b77a5a0a46f4'
            repo: child-safety-client
            tag: v8
            sha: 889b8f4c03d17eefad319029586a1b82049ceb8609665c96274f3477055487d6
            build: '8'
            version: '1.0.8'
            notes: 'Child Safety v8: encrypted bounded offline FIFO reports, original GPS timestamps preserved, replay on reconnect, server deduplication, speed quality metadata. Same visible user-started location service and silent tracking notification with Stop. No scenario test rounds requested; compilation and APK audit passed. Queue capped at2880reports, oldest dropped when full. Force-stop prevents tracking; not emergency protection.'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm ci --prefix distribution/tooling --ignore-scripts --no-audit --no-fund
      - name: Download reviewed published APK and verify hash
        env:
          SOURCE_REPO: ${{ matrix.repo }}
          SOURCE_TAG: ${{ matrix.tag }}
          EXPECTED_SHA: ${{ matrix.sha }}
        run: |
          curl -fL "https://github.com/frances09f-lgtm/$SOURCE_REPO/releases/download/$SOURCE_TAG/app-release.apk" -o "$RUNNER_TEMP/App.apk"
          printf '%s %s\n' "$EXPECTED_SHA" "$RUNNER_TEMP/App.apk" | sha256sum -c
      - name: Upload and distribute to existing owner tester
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_APP_RESOURCE: ${{ matrix.app }}
          EXPECTED_SHA: ${{ matrix.sha }}
          EXPECTED_BUILD: ${{ matrix.build }}
          EXPECTED_VERSION: ${{ matrix.version }}
          RELEASE_NOTES: ${{ matrix.notes }}
          RESULT_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          umask 077
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-distribution.json"
          trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          unset FIREBASE_SERVICE_ACCOUNT_JSON
          node scripts/firebase_parent_child_v1.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: firebase-${{ matrix.name }}-result
          path: ${{ runner.temp }}/firebase-${{ matrix.name }}-result.json
