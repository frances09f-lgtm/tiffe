name: Distribute Parent safe-zone notifications v1.4.0 privately
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - name: parent
            app: 'projects/509368336413/apps/1:509368336413:android:90f647c88882d7e40a46f4'
            repo: child-safety-parent
            tag: v1.4.0
            asset: ChildSafetyParent-v1.4.0.apk
            sha: c5e9df3524dad72de270e18311893b4d0bd4b07e95e9198f4d901ec044b5490f
            build: '5'
            version: '1.4.0'
            notes: 'Parent v1.4.0: Settings > Safe-zone notifications, allow Android permission. New confirmed entry/exit events raise local alerts; tap opens Safe Zones. Off/logout stops checks. Foreground checks every 30 seconds; background checks from 15 minutes and may be delayed or stopped by battery limits, no internet or force-stop. Remembered login required. Not instant FCM push. Android15 synthetic alert/tap verified; physical crossings/background timing not tested. Child remains 1.0.10. Install over existing Parent.'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm ci --prefix distribution/tooling --ignore-scripts --no-audit --no-fund
      - name: Download reviewed published APK and verify hash
        env:
          SOURCE_REPO: ${{ matrix.repo }}
          SOURCE_TAG: ${{ matrix.tag }}
          SOURCE_ASSET: ${{ matrix.asset }}
          EXPECTED_SHA: ${{ matrix.sha }}
        run: |
          curl -fL "https://github.com/frances09f-lgtm/$SOURCE_REPO/releases/download/$SOURCE_TAG/$SOURCE_ASSET" -o "$RUNNER_TEMP/App.apk"
          printf '%s %s\n' "$EXPECTED_SHA" "$RUNNER_TEMP/App.apk" | sha256sum -c
      - name: Upload and distribute to existing owner tester
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_APP_RESOURCE: ${{ matrix.app }}
          EXPECTED_SHA: ${{ matrix.sha }}
          EXPECTED_BUILD: ${{ matrix.build }}
          EXPECTED_VERSION: ${{ matrix.version }}
          RELEASE_NOTES: ${{ matrix.notes }}
          RESULT_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          umask 077
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-distribution.json"
          trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          unset FIREBASE_SERVICE_ACCOUNT_JSON
          node scripts/firebase_parent_child_v1.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: firebase-${{ matrix.name }}-result
          path: ${{ runner.temp }}/firebase-${{ matrix.name }}-result.json
