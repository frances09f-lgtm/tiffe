name: Build Tiffe Staff APK
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish staff-v6 only after analyze, full tests and signed builds pass
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.patch.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
      - name: Apply and commit the reviewed Staff-only Upcoming and newest-first patch
        id: patch
        run: |
          set -euo pipefail
          python3 scripts/patch_staff_upcoming.py
          dart format lib/staff/partner_hub.dart test/staff_upcoming_orders_test.dart
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/staff/partner_hub.dart pubspec.yaml lib/live/bug_report.dart test/staff_upcoming_orders_test.dart
          if ! git diff --cached --quiet; then
            git commit -m 'Staff v6: Upcoming list in Live Kitchen, newest-first All Orders, paired version bump'
            git push origin HEAD:${{ github.ref_name }}
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --dart-define=TIFFE_OWNER_EMAIL=frances09f@gmail.com
      - name: Build signed Staff APK and AAB
        env:
          TIFFE_KEYSTORE_BASE64: ${{ secrets.TIFFE_KEYSTORE_BASE64 }}
          TIFFE_KEYSTORE_FILE: ${{ runner.temp }}/tiffe-release.jks
          TIFFE_KEYSTORE_PASSWORD: ${{ secrets.TIFFE_KEYSTORE_PASSWORD }}
          TIFFE_KEY_PASSWORD: ${{ secrets.TIFFE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          trap 'rm -f "$TIFFE_KEYSTORE_FILE"' EXIT
          printf '%s' "$TIFFE_KEYSTORE_BASE64" | base64 -d > "$TIFFE_KEYSTORE_FILE"
          FLAGS=(--release -t lib/staff_main.dart --build-name=1.0.6 --build-number=6 --dart-define=TIFFE_SUPABASE_URL=https://obbtxyjglgivcpusjpcx.supabase.co --dart-define=TIFFE_SUPABASE_KEY=sb_publishable__5qR0bvVmwqKykgbQpAtRw_H0eIgl3_ --dart-define=TIFFE_OWNER_EMAIL=frances09f@gmail.com)
          flutter build apk --target-platform android-arm,android-arm64 "${FLAGS[@]}"
          flutter build appbundle --target-platform android-arm,android-arm64 "${FLAGS[@]}"
          mkdir staff-build
          cp build/app/outputs/flutter-apk/app-release.apk staff-build/Tiffe-Staff.apk
          cp build/app/outputs/bundle/release/app-release.aab staff-build/Tiffe-Staff.aab
          sha256sum staff-build/*
          stat -c '%n %s bytes' staff-build/*
      - uses: actions/upload-artifact@v4
        with:
          name: tiffe-staff-apk
          path: staff-build/*
          if-no-files-found: error
  release:
    needs: build
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tiffe-staff-apk
          path: staff-build
      - name: Publish green-CI Staff v6
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          SHA256=$(sha256sum staff-build/Tiffe-Staff.apk | cut -d' ' -f1)
          SIZE=$(stat -c %s staff-build/Tiffe-Staff.apk)
          cat > notes.md <<EOF
          Tiffe Staff v6, version 1.0.6 (6), com.ambi.tiffe.staff

          Live Kitchen now has an Upcoming Orders list for open orders dated after today, for the owner and kitchen roles. The customer app dates orders placed after its daily cut-off for tomorrow, so these orders were hidden from Live Kitchen until that day. Upcoming orders are shown separately and are not counted in today's tiffin, chapati, rice or bhaji totals.

          All Orders now lists the newest order first.

          Payment, login, roles, order creation and order actions are unchanged. This build does not add push notifications: a new order shows when the app is open, refreshed every 15 seconds.

          Flutter analyze, the full test suite, and signed APK/AAB builds passed in CI ${GITHUB_RUN_ID} before publication.

          APK: ${SIZE} bytes. SHA256: ${SHA256}
          Not tested on a phone. No live Supabase, payment, login or real-order end-to-end test was performed. It cannot override database row-access rules.
          EOF
          gh release create staff-v6 staff-build/Tiffe-Staff.apk staff-build/Tiffe-Staff.aab --target '${{ needs.build.outputs.sha }}' --title 'Tiffe Staff v6 - Upcoming orders and newest-first All Orders' --notes-file notes.md --prerelease
  firebase:
    needs: [build, release]
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm ci --prefix distribution/tooling --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: tiffe-staff-apk
          path: staff-build
      - name: Upload identical Staff APK to existing Firebase app without adding testers
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          APK_PATH: staff-build/Tiffe-Staff.apk
        run: |
          set -euo pipefail
          umask 077
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-staff.json"
          trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          unset FIREBASE_SERVICE_ACCOUNT_JSON
          export EXPECTED_SHA256=$(sha256sum "$APK_PATH" | cut -d' ' -f1)
          node scripts/firebase_staff_v6.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: firebase-staff-v6-result
          path: ${{ runner.temp }}/firebase-staff-v6-result.json
          if-no-files-found: error
