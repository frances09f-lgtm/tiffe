name: Build Tiffe Staff APK
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the Staff release (and update the feed) only after analyze, full tests and signed builds pass
        type: boolean
        default: false
env:
  # Edit these two values and distribution/staff-release-notes.md for each Staff release.
  STAFF_VERSION: '1.0.11'
  STAFF_BUILD: '11'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.patch.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
      - name: Apply and commit the reviewed Staff update-button patch
        id: patch
        run: |
          set -euo pipefail
          python3 scripts/patch_staff_update.py
          python3 scripts/patch_staff_orders.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib android pubspec.yaml
          if ! git diff --cached --quiet; then
            git commit -m 'Staff 1.0.8: all orders in Live Kitchen queues, Today filter includes orders placed today'
            git push origin HEAD:${{ github.ref_name }}
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --dart-define=TIFFE_OWNER_EMAIL=frances09f@gmail.com
      - name: Dump staff shot as base64 into the log
        if: always()
        run: |
          if [ -f /tmp/staff-v9-kitchen.png ]; then
            base64 /tmp/staff-v9-kitchen.png | sed 's/^/PNGB64: /'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staff-ui-shots
          path: /tmp/*.png
          if-no-files-found: ignore
      - name: Build signed Staff APK and AAB
        env:
          TIFFE_KEYSTORE_BASE64: ${{ secrets.TIFFE_KEYSTORE_BASE64 }}
          TIFFE_KEYSTORE_FILE: ${{ runner.temp }}/tiffe-release.jks
          TIFFE_KEYSTORE_PASSWORD: ${{ secrets.TIFFE_KEYSTORE_PASSWORD }}
          TIFFE_KEY_PASSWORD: ${{ secrets.TIFFE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          trap 'rm -f "$TIFFE_KEYSTORE_FILE"' EXIT
          printf '%s' "$TIFFE_KEYSTORE_BASE64" | base64 -d > "$TIFFE_KEYSTORE_FILE"
          FLAGS=(--release -t lib/staff_main.dart --build-name="$STAFF_VERSION" --build-number="$STAFF_BUILD" --dart-define=TIFFE_SUPABASE_URL=https://obbtxyjglgivcpusjpcx.supabase.co --dart-define=TIFFE_SUPABASE_KEY=sb_publishable__5qR0bvVmwqKykgbQpAtRw_H0eIgl3_ --dart-define=TIFFE_OWNER_EMAIL=frances09f@gmail.com)
          flutter build apk --target-platform android-arm,android-arm64 "${FLAGS[@]}"
          flutter build appbundle --target-platform android-arm,android-arm64 "${FLAGS[@]}"
          mkdir staff-build
          cp build/app/outputs/flutter-apk/app-release.apk staff-build/Tiffe-Staff.apk
          cp build/app/outputs/bundle/release/app-release.aab staff-build/Tiffe-Staff.aab
          sha256sum staff-build/*
          stat -c '%n %s bytes' staff-build/*
      - uses: actions/upload-artifact@v4
        with:
          name: tiffe-staff-apk
          path: staff-build/*
          if-no-files-found: error
  release:
    needs: build
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: tiffe-staff-apk
          path: staff-build
      - name: Publish green-CI Staff release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          SHA256=$(sha256sum staff-build/Tiffe-Staff.apk | cut -d' ' -f1)
          SIZE=$(stat -c %s staff-build/Tiffe-Staff.apk)
          {
            echo "Tiffe Staff ${STAFF_VERSION} (${STAFF_BUILD}), com.ambi.tiffe.staff"
            echo
            cat distribution/staff-release-notes.md
            echo
            echo "CI run ${GITHUB_RUN_ID}. APK: ${SIZE} bytes. SHA256: ${SHA256}"
          } > notes.md
          gh release create "staff-v${STAFF_BUILD}" staff-build/Tiffe-Staff.apk staff-build/Tiffe-Staff.aab --target '${{ needs.build.outputs.sha }}' --title "Tiffe Staff ${STAFF_VERSION}" --notes-file notes.md --prerelease
  mirror:
    # Copy the APK to the apk-mirror branch (raw.githubusercontent.com) and
    # update the mirror feed Staff 1.0.11+ reads. Uses only this repo's token.
    needs: [build, release]
    if: ${{ inputs.publish }}
    permissions:
      contents: write
    uses: ./.github/workflows/apk-mirror.yml
    with:
      tag: staff-v11
      feed_key: tiffe_staff
      version: '1.0.11'
      asset: Tiffe-Staff.apk
  feed:
    needs: [build, release, mirror]
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}
      - name: Update update-feed (child-safety-updates)
        env:
          FEED_TOKEN: ${{ secrets.UPDATES_FEED_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "$FEED_TOKEN" ]; then
            echo "::warning::UPDATES_FEED_TOKEN secret is not set in this repo, so version.json in child-safety-updates was not updated"
            exit 0
          fi
          git clone "https://x-access-token:${FEED_TOKEN}@github.com/frances09f-lgtm/child-safety-updates.git" "$RUNNER_TEMP/feed"
          NOTES_FILE="$PWD/distribution/staff-release-notes.md"
          cd "$RUNNER_TEMP/feed"
          NOTES_FILE="$NOTES_FILE" python3 - <<'PY'
          import json, os
          p = 'version.json'
          d = json.load(open(p))
          v = os.environ['STAFF_VERSION']
          d['tiffe_staff'] = {
              'version': v,
              'notes': open(os.environ['NOTES_FILE']).read().strip(),
              # Mirror first: GitHub release downloads are blocked on some networks.
              'apk': 'https://raw.githubusercontent.com/%s/apk-mirror/staff/%s/Tiffe-Staff.apk' % (os.environ['REPO'], v),
              'mirrors': [
                  'https://github.com/%s/releases/download/staff-v%s/Tiffe-Staff.apk' % (os.environ['REPO'], os.environ['STAFF_BUILD']),
              ],
          }
          open(p, 'w').write(json.dumps(d, indent=2, ensure_ascii=False) + '\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then echo "feed already current"; exit 0; fi
          git commit -am "tiffe_staff ${STAFF_VERSION}: update feed from release"
          git push origin HEAD:main
