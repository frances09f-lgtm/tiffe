name: Build Tiffe Staff APK
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a GitHub release after analyze, tests and build pass'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --dart-define=TIFFE_OWNER_EMAIL=frances09f@gmail.com
      - name: Build separate signed Staff APK
        env:
          TIFFE_KEYSTORE_BASE64: ${{ secrets.TIFFE_KEYSTORE_BASE64 }}
          TIFFE_KEYSTORE_FILE: ${{ runner.temp }}/tiffe-release.jks
          TIFFE_KEYSTORE_PASSWORD: ${{ secrets.TIFFE_KEYSTORE_PASSWORD }}
          TIFFE_KEY_PASSWORD: ${{ secrets.TIFFE_KEY_PASSWORD }}
        run: |
          printf '%s' "$TIFFE_KEYSTORE_BASE64" | base64 -d > "$TIFFE_KEYSTORE_FILE"
          flutter build apk --release --target-platform android-arm64 -t lib/staff_main.dart --build-name=1.0.3 --build-number=3 \
            --dart-define=TIFFE_SUPABASE_URL=https://obbtxyjglgivcpusjpcx.supabase.co \
            --dart-define=TIFFE_SUPABASE_KEY=sb_publishable__5qR0bvVmwqKykgbQpAtRw_H0eIgl3_ \
            --dart-define=TIFFE_OWNER_EMAIL=frances09f@gmail.com
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Tiffe-Staff.apk
          rm -f "$TIFFE_KEYSTORE_FILE"
      - uses: actions/upload-artifact@v4
        with:
          name: tiffe-staff-apk
          path: build/app/outputs/flutter-apk/Tiffe-Staff.apk
  release:
    needs: build
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tiffe-staff-apk
          path: staff-apk
      - name: Publish Tiffe Staff v3 release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          SHA256=$(sha256sum staff-apk/Tiffe-Staff.apk | cut -d' ' -f1)
          SIZE=$(stat -c %s staff-apk/Tiffe-Staff.apk)
          cat > notes.md <<EOF
          # Tiffe Staff v3

          Version 1.0.3 (3), package com.ambi.tiffe.staff.

          Fixes in All Orders (Live orders & dispatch):
          - The Mark Preparing button now has an orange fill with dark text, so the label is readable. The Add subscription button uses the same style.
          - Verify payment stays on one line.

          Order, payment, login and role logic are unchanged. Analyze, the full test suite and the signed build passed in CI run ${GITHUB_RUN_ID} before this release was created.

          APK size: ${SIZE} bytes. APK SHA256: ${SHA256}.

          Not tested on a physical phone. Firebase App Distribution is not part of this release.
          EOF
          gh release create staff-v3 staff-apk/Tiffe-Staff.apk --target "${{ github.sha }}" --title "Tiffe Staff v3 - readable order buttons" --notes-file notes.md --prerelease
