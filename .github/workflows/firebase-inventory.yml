name: Read-only Firebase version inventory
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - run: npm ci --prefix distribution/tooling --ignore-scripts --no-audit --no-fund
      - name: Read versions only, no uploads or invitations
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          umask 077
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-read.json"
          trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          unset FIREBASE_SERVICE_ACCOUNT_JSON
          node <<'JS'
          const fs=require('fs');
          const {GoogleAuth}=require('./distribution/tooling/node_modules/google-auth-library');
          (async()=>{
            const p=JSON.parse(fs.readFileSync('distribution/policy.json'));
            const c=await new GoogleAuth({scopes:['https://www.googleapis.com/auth/cloud-platform']}).getClient();
            let pageToken, versions=[];
            do {
              const r=await c.request({url:`https://firebaseappdistribution.googleapis.com/v1/projects/${p.firebase_project_number}/apps/${p.firebase_app_id}/releases`,params:{pageSize:100,...(pageToken?{pageToken}:{})},timeout:30000});
              versions.push(...(r.data.releases||[]).map(x=>({build_version:x.buildVersion,display_version:x.displayVersion})));
              pageToken=r.data.nextPageToken;
            } while(pageToken);
            fs.writeFileSync(process.env.RUNNER_TEMP+'/firebase-versions.json',JSON.stringify({app_id:p.firebase_app_id,versions,complete:true},null,2));
          })().catch(()=>{console.error('Inventory API/access failure');process.exit(1)});
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: firebase-version-inventory
          path: ${{ runner.temp }}/firebase-versions.json
          if-no-files-found: error
