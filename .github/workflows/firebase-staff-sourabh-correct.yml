name: Correct Sourabh Staff v2 tester email
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  invite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm ci --prefix distribution/tooling --ignore-scripts --no-audit --no-fund
      - name: Distribute existing Staff v2 to corrected recipient only
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          umask 077
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase.json"
          trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          unset FIREBASE_SERVICE_ACCOUNT_JSON
          node scripts/firebase_staff_sourabh_correct.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: firebase-sourabh-correction
          path: ${{ runner.temp }}/firebase-sourabh-correction.json
          if-no-files-found: error
