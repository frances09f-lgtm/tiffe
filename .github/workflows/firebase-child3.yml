name: Distribute audited Child3
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  distribute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm ci --prefix distribution/tooling --ignore-scripts --no-audit --no-fund
      - name: Download and verify reviewed public-source APK
        run: |
          curl -fL https://github.com/frances09f-lgtm/child-safety-client/releases/download/v3/app-release.apk -o "$RUNNER_TEMP/Child.apk"
          echo '536554951b60125ff2caaea456fbdedf0096d94e495054924e681dd3158a92e0 '"$RUNNER_TEMP/Child.apk" | sha256sum -c
      - name: Upload and verify live version
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          umask 077
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-distribution.json"
          trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          unset FIREBASE_SERVICE_ACCOUNT_JSON
          node scripts/firebase_child3.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: firebase-child3-result
          path: ${{ runner.temp }}/firebase-child3-result.json
