name: Customer v53
on:
  workflow_dispatch:
    inputs:
      publish_release:
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: tiffe-customer-v53
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/feat/customer-v53'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
      - name: Validate matching app version
        id: version
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          version = re.search(r'^version:\s*(1\.0\.(\d+)\+\d+)\s*$', pathlib.Path('pubspec.yaml').read_text(), re.M)
          assert version, 'Invalid pubspec version'
          full, code = version.group(1), version.group(2)
          assert full == f'1.0.{code}+{code}', 'Version name/build number mismatch'
          assert code == '53', 'Customer v53 workflow must build 1.0.53+53'
          assert f"'{full}'" in pathlib.Path('lib/live/bug_report.dart').read_text(), 'Bug report version mismatch'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'tag=v{code}\nname=1.0.{code}\ncode={code}\n')
          PY
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --dart-define=TIFFE_OWNER_EMAIL=frances09f@gmail.com
      - name: Build signed customer APK and AAB
        env:
          TIFFE_KEYSTORE_BASE64: ${{ secrets.TIFFE_KEYSTORE_BASE64 }}
          TIFFE_KEYSTORE_FILE: ${{ runner.temp }}/tiffe-release.jks
          TIFFE_KEYSTORE_PASSWORD: ${{ secrets.TIFFE_KEYSTORE_PASSWORD }}
          TIFFE_KEY_PASSWORD: ${{ secrets.TIFFE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          : "${TIFFE_KEYSTORE_BASE64:?Missing signing keystore}"
          trap 'rm -f "$TIFFE_KEYSTORE_FILE"' EXIT
          printf '%s' "$TIFFE_KEYSTORE_BASE64" | base64 -d > "$TIFFE_KEYSTORE_FILE"
          args=(--release -t lib/connected_main.dart --build-name=1.0.53 --build-number=53
            --dart-define=TIFFE_SUPABASE_URL=https://obbtxyjglgivcpusjpcx.supabase.co
            --dart-define=TIFFE_SUPABASE_KEY=sb_publishable__5qR0bvVmwqKykgbQpAtRw_H0eIgl3_
            --dart-define=TIFFE_OWNER_EMAIL=frances09f@gmail.com)
          flutter build appbundle "${args[@]}"
          mv build/app/outputs/bundle/release/app-release.aab build/app/outputs/bundle/release/Tiffe.aab
          flutter build apk "${args[@]}" --target-platform android-arm,android-arm64
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Tiffe.apk
      - name: Check the notification icon is inside the APK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          AAPT2="$(ls "$SDK"/build-tools/*/aapt2 | sort -V | tail -1)"
          "$AAPT2" dump resources build/app/outputs/flutter-apk/Tiffe.apk > "$RUNNER_TEMP/res.txt"
          grep -E 'ic_tiffe_notification|mipmap/ic_launcher' "$RUNNER_TEMP/res.txt" | sed -n '1,8p'
          grep -q 'drawable/ic_tiffe_notification' "$RUNNER_TEMP/res.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: tiffe-v53
          if-no-files-found: error
          path: |
            build/app/outputs/flutter-apk/Tiffe.apk
            build/app/outputs/bundle/release/Tiffe.aab
      - name: Publish release after green build
        if: success() && inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v53 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then exit 1; fi
          gh release create v53 --repo "$GITHUB_REPOSITORY" --target "$(git rev-parse HEAD)" --title 'Tiffe customer v53' --notes 'One tiffin can now hold two of the same bhaji, and an order placed before the 9 AM cutoff is scheduled for the same day.' build/app/outputs/flutter-apk/Tiffe.apk build/app/outputs/bundle/release/Tiffe.aab
